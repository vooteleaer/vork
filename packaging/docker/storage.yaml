# vØrk storage in Docker, beside a vØrk node (node.yaml, or the vork
# package's system service): vorkd with its store, and its pages in the
# node's dashboard (vork-web). TrueNAS SCALE: Apps → Discover → ⋮ → Install
# via YAML; or `docker compose -f storage.yaml up -d`.
#
# A first small container downloads a release's static storage programs
# (checked against their SHA-256) and ends; the two that run have no network
# of their own: they reach the node through its local API socket.
#
# Change before installing:
# - /mnt/tank/apps/vork-storage: the folder that keeps the store (your
#   files, encrypted) and the programs; put it where there is room;
# - /mnt/tank/apps/vork/state: the node's state folder, which holds its
#   api.sock (node.yaml's folder + /state; the vork package's: /var/lib/vork);
# - hostname: this device's name among your devices;
# - --max-store: how much of the disk storage may use;
# - for another release, VORK_RELEASE and VORK_SHA256 (from its SHA256SUMS);
#   on an ARM machine, vork-storage-linux-aarch64.tar.gz and its SHA-256.
# Then join it to your libraries from the vØrk dashboard (Storage).
x-storage: &storage
  image: alpine:3.20
  restart: unless-stopped
  network_mode: none
  volumes:
    - /mnt/tank/apps/vork-storage:/data
    - /mnt/tank/apps/vork/state:/node
  environment:
    VORK_API: /node/api.sock
services:
  vork-storage-get:
    image: alpine:3.20
    restart: "no"
    environment:
      VORK_RELEASE: v0.4.0
      VORK_FILE: vork-storage-linux-x86_64.tar.gz
      VORK_SHA256: ""
    volumes:
      - /mnt/tank/apps/vork-storage:/data
    command:
      - sh
      - -c
      - |
        set -e
        mkdir -p /data/bin /data/store
        if [ "$$(cat /data/bin/.sha256 2>/dev/null)" != "$$VORK_SHA256" ]; then
          wget -qO /tmp/s.tgz "https://github.com/vooteleaer/vork/releases/download/$$VORK_RELEASE/$$VORK_FILE"
          echo "$$VORK_SHA256  /tmp/s.tgz" | sha256sum -c -s || { echo "the download's SHA-256 doesn't match"; exit 1; }
          tar xzf /tmp/s.tgz -C /data/bin
          echo "$$VORK_SHA256" > /data/bin/.sha256
        fi
  vork-storage:
    <<: *storage
    container_name: vork-storage
    hostname: nas
    stop_signal: SIGINT          # vorkd closes its store
    stop_grace_period: 30s
    depends_on:
      vork-storage-get: { condition: service_completed_successfully }
    command: ["/data/bin/vorkd", "--store", "/data/store", "--max-store", "500G"]
  vork-storage-web:
    <<: *storage
    container_name: vork-storage-web
    depends_on: [vork-storage]
    command: ["/data/bin/vork-web", "--store", "/data/store", "--dashboard", "/node/api.sock"]
