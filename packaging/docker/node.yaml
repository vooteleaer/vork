# The vØrk node alone, in one small container: for a NAS or a server that
# runs Docker but takes no packages (TrueNAS SCALE: Apps → Discover → ⋮ →
# Install via YAML; or `docker compose -f node.yaml up -d`).
#
# It downloads a release's static node (checked against its SHA-256), makes
# its configuration and identity at the first start, and runs it with the
# vork0 interface, so this machine has its vØrk address and IPv4 too.
#
# Change before installing:
# - the folder that keeps the node (its identity!), /mnt/tank/apps/vork here;
# - for another release, VORK_RELEASE and VORK_SHA256 (from its SHA256SUMS);
#   on an ARM machine, vork-linux-aarch64 and its SHA-256.
# The node's settings are then in that folder's vork.toml (restart after
# editing). Its dashboard is on VORK_WEB (HTTPS; TrueNAS shows a Web UI
# button for it); the private link to open it with comes from
#   docker exec <container> /var/lib/vork/bin/vork web-link --config /var/lib/vork/vork.toml
# Leave VORK_WEB empty for no dashboard.
x-portals:
  - name: Web UI
    scheme: https
    host: 0.0.0.0
    port: 30742
    path: /
services:
  vork:
    image: alpine:3.20
    container_name: vork
    network_mode: host        # the node's UDP port (a free one, chosen at the first start) is the machine's
    restart: unless-stopped
    cap_add: [NET_ADMIN]      # the vork0 interface
    devices: ["/dev/net/tun:/dev/net/tun"]
    stop_grace_period: 15s
    stop_signal: SIGINT
    environment:
      VORK_RELEASE: v0.5.0
      VORK_FILE: vork-linux-x86_64
      VORK_SHA256: 10af4016a45ef6f7600843eb6a2550c8ce5a08fc2a61c2c320c8479ec1996bf3
      VORK_WEB: "[::]:30742"    # the dashboard, IPv4 and IPv6 (a high port, as TrueNAS asks of apps)
    volumes:
      - /mnt/tank/apps/vork:/var/lib/vork
    command:
      - sh
      - -c
      - |
        set -e
        apk add --no-cache -q iproute2 iptables
        B=/var/lib/vork/bin/vork
        mkdir -p /var/lib/vork/bin
        if ! echo "$$VORK_SHA256  $$B" | sha256sum -c -s 2>/dev/null; then
          wget -qO "$$B.new" "https://github.com/vooteleaer/vork/releases/download/$$VORK_RELEASE/$$VORK_FILE"
          echo "$$VORK_SHA256  $$B.new" | sha256sum -c -s || { echo "the download's SHA-256 doesn't match"; exit 1; }
          chmod 755 "$$B.new" && mv "$$B.new" "$$B"
        fi
        C=/var/lib/vork/vork.toml
        [ -e "$$C" ] || "$$B" init --config "$$C" --tun vork0 --port auto
        if [ -n "$$VORK_WEB" ] && ! grep -q '^web *=' "$$C"; then
          sed -i "s|^# web = .*|web = \"$$VORK_WEB\"|" "$$C"
          grep -q '^web *=' "$$C" || echo "web = \"$$VORK_WEB\"" >> "$$C"
        fi
        exec "$$B" run --config "$$C"
