[package]
name = "vork"
version = "0.0.1"
edition = "2024"
description = "Phase-1 prototype: serverless identity-addressed network over WireGuard (boringtun)"
license = "MIT"

[dependencies]
anyhow = "1"
boringtun = "0.7.1"
clap = { version = "4", features = ["derive"] }
crab_nat = "0.8"
ed25519-dalek = "2"
getrandom = "0.2"
hex = "0.4"
igd-next = { version = "0.18", features = ["aio_tokio"] }
libc = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
socket2 = "0.5"
tokio = { version = "1", features = ["full"] }
toml = "0.8"

[target."cfg(windows)".dependencies]
windows-service = "0.8"
