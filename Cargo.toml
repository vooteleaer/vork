[workspace]
resolver = "2"
members = [".", "crates/libvork", "crates/vork-api", "crates/vork-card", "crates/vork-cloudfiles", "crates/vork-core", "crates/vork-extract", "crates/vork-fuse", "crates/vork-gateway", "crates/vork-haikufs", "crates/vork-storage-net", "crates/vork-storage-node", "crates/vork-store", "crates/vork-tree", "clients/core", "clients/web", "clients/gtk", "clients/windows", "clients/haiku/capi"]
# The GTK, Windows and Haiku front ends build only on their own systems: `cargo build -p vork-desktop-gtk` etc.
# The network's desktop window (clients/net-desktop) is its own workspace: its GTK 3 / WebKitGTK
# dependencies would hold the node's crates (toml) back to old versions.
default-members = [".", "crates/libvork", "crates/vork-api", "crates/vork-card", "crates/vork-cloudfiles", "crates/vork-core", "crates/vork-extract", "crates/vork-fuse", "crates/vork-gateway", "crates/vork-haikufs", "crates/vork-storage-net", "crates/vork-storage-node", "crates/vork-store", "crates/vork-tree", "clients/core", "clients/web"]
exclude = ["vendor", "clients/android/jni", "clients/net-desktop"]

[workspace.package]
version = "0.6.0"
publish = false
edition = "2024"
license = "MIT"

# cloud-filter 0.0.6 with its callbacks not panicking when failing a
# request Windows already dropped (that aborted vork-cloudfiles).
[patch.crates-io]
cloud-filter = { path = "vendor/cloud-filter" }

[package]
name = "vork"
version = "0.3.0"
edition.workspace = true
description = "Phase-1 prototype: serverless identity-addressed network over WireGuard (boringtun)"
license.workspace = true

[dependencies]
vork-api = { path = "crates/vork-api" }
anyhow = "1"
boringtun = "0.7.1"
clap = { version = "4", features = ["derive"] }
crab_nat = "0.8"
ed25519-dalek = "2"
getrandom = "0.2"
hex = "0.4"
igd-next = { version = "0.18", features = ["aio_tokio"] }
libc = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
# The dashboard's HTTPS (ring is in the build already, through boringtun).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
# The roots for fetching the bootstrap list over HTTPS (no system store on Android or Haiku).
webpki-roots = "0.26"
socket2 = "0.5"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
qrcode = { version = "0.14.1", default-features = false }

# Local network discovery; not on Haiku yet (mdns-sd needs IP_PKTINFO).
[target.'cfg(not(target_os = "haiku"))'.dependencies]
mdns-sd = "0.22.0"

[target."cfg(windows)".dependencies]
windows-service = "0.8"
wintun = "0.5"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Networking_WinSock", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis"] }
