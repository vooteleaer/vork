[package]
name = "vork"
version = "0.0.1"
edition = "2024"
description = "Phase-1 prototype: serverless identity-addressed network over WireGuard (boringtun)"
license = "MIT"

[dependencies]
anyhow = "1"
boringtun = "0.7.1"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "2"
getrandom = "0.2"
hex = "0.4"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
