[workspace]
resolver = "2"
members = [".", "crates/libvork", "crates/vork-api", "crates/vork-card", "crates/vork-cloudfiles", "crates/vork-core", "crates/vork-extract", "crates/vork-fuse", "crates/vork-gateway", "crates/vork-haikufs", "crates/vork-storage-net", "crates/vork-storage-node", "crates/vork-store", "crates/vork-tree"]
exclude = ["vendor"]

[workspace.package]
edition = "2024"
license = "MIT"

# cloud-filter 0.0.6 with its callbacks not panicking when failing a
# request Windows already dropped (that aborted vork-cloudfiles).
[patch.crates-io]
cloud-filter = { path = "vendor/cloud-filter" }

[package]
name = "vork"
version = "0.0.1"
edition.workspace = true
description = "Phase-1 prototype: serverless identity-addressed network over WireGuard (boringtun)"
license.workspace = true

[dependencies]
vork-api = { path = "crates/vork-api" }
anyhow = "1"
boringtun = "0.7.1"
clap = { version = "4", features = ["derive"] }
crab_nat = "0.8"
ed25519-dalek = "2"
getrandom = "0.2"
hex = "0.4"
igd-next = { version = "0.18", features = ["aio_tokio"] }
libc = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
socket2 = "0.5"
tokio = { version = "1", features = ["full"] }
toml = "0.8"

[target."cfg(windows)".dependencies]
windows-service = "0.8"
