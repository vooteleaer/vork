<style>
  :root {
    --bg: #111215; --panel: #18191d; --panel2: #1e1f24; --line: #2a2c33; --line2: #33363e;
    --text: #e7e8ec; --dim: #8b8f9a; --faint: #5d616b;
    --accent: #4f8dff; --accent2: #7aa8ff; --ok: #3ccf8e; --warn: #f2a93b; --bad: #f2555a; --violet: #a78bfa;
    --r: 10px; --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f4f5f7; --panel: #ffffff; --panel2: #f7f8fa; --line: #e3e5ea; --line2: #d5d8df; --text: #1b1d22; --dim: #646a76; --faint: #9aa0aa; --accent: #2f6fed; --accent2: #2f6fed; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 14px/1.45 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: var(--accent2); }
  .app { display: grid; grid-template-columns: 224px 1fr; min-height: 100vh; }
  aside { background: var(--panel); border-right: 1px solid var(--line); padding: 18px 12px; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 4px; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px; font-weight: 650; font-size: 18px; letter-spacing: .2px; }
  .logo svg, .mlogo svg { width: 100%; height: 100%; display: block; }
  .brand .logo { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, var(--accent), var(--violet)); display: grid; place-items: center; color: #fff; font-size: 15px; font-weight: 700; }
  nav a { display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 8px; color: var(--dim); text-decoration: none; font-weight: 500; cursor: pointer; }
  nav a svg { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  nav a:hover { background: var(--panel2); color: var(--text); }
  nav a.on { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--text); }
  nav a.on svg { color: var(--accent2); }
  nav a .count { margin-left: auto; background: var(--bad); color: #fff; border-radius: 10px; padding: 0 7px; font-size: 11px; font-weight: 600; }
  .side-foot { margin-top: auto; padding: 10px 12px; font-size: 12px; color: var(--faint); }
  main { min-width: 0; }
  header.top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 14px; padding: 14px 28px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  header.top h1 { margin: 0; font-size: 17px; font-weight: 600; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 550; background: var(--panel2); border: 1px solid var(--line); color: var(--dim); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); display: inline-block; flex: none; }
  .dot.ok { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 22%, transparent); }
  .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
  .grow { flex: 1; }
  .content { padding: 24px 28px 60px; }
  .grid { display: grid; gap: 16px; align-items: start; }
  .grid.stretch { align-items: stretch; }
  .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g21 { grid-template-columns: 2fr 1fr; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; min-width: 0; }
  .card h2 { margin: 0 0 2px; font-size: 14px; font-weight: 600; letter-spacing: .1px; }
  .card .sub { color: var(--dim); font-size: 12.5px; margin-bottom: 12px; }
  .card-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 12px; }

  .kpi .label { color: var(--dim); font-size: 12px; font-weight: 550; text-transform: uppercase; letter-spacing: .6px; }
  .kpi .value { font-size: 26px; font-weight: 650; margin-top: 6px; font-variant-numeric: tabular-nums; }

  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--dim); }

  .chart { position: relative; height: 260px; }
  .chart canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .tip { position: absolute; pointer-events: none; background: var(--panel2); border: 1px solid var(--line2); border-radius: 8px; padding: 7px 10px; font-size: 12px; white-space: nowrap; display: none; box-shadow: 0 6px 20px rgba(0,0,0,.25); z-index: 2; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .6px; color: var(--faint); font-weight: 600; padding: 0 12px 10px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 11px 12px 11px 0; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .mono { font-family: var(--mono); font-size: 12.5px; }
  .name { font-weight: 600; }
  .muted { color: var(--dim); } .small { font-size: 12px; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 6px; font-size: 11.5px; font-weight: 600; background: var(--panel2); border: 1px solid var(--line); color: var(--dim); }
  .tag.blue { color: var(--accent2); border-color: color-mix(in srgb, var(--accent) 40%, transparent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .tag.green { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); background: color-mix(in srgb, var(--ok) 10%, transparent); }
  .tag.amber { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); background: color-mix(in srgb, var(--warn) 10%, transparent); }
  .tag.red { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); background: color-mix(in srgb, var(--bad) 10%, transparent); }
  button { font: inherit; cursor: pointer; border-radius: 8px; }

  .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line2); }
  .btn.ghost:hover { background: var(--panel2); }
  .btn.danger { background: transparent; color: var(--bad); border: 1px solid color-mix(in srgb, var(--bad) 45%, transparent); }
  .btn.sm { padding: 5px 10px; font-size: 12.5px; }

  .tag { white-space: nowrap; }
  .notes { line-height: 1.55; overflow-wrap: anywhere; }

  .notes code { font-family: var(--mono); font-size: 12.5px; background: var(--panel2); padding: 1px 5px; border-radius: 4px; }
  .notes a { color: var(--accent2); }
  .link { background: none; border: 0; color: var(--accent2); padding: 2px 4px; font-weight: 550; }
  .copy { background: none; border: 0; color: var(--faint); padding: 2px 4px; }
  .copy:hover { color: var(--accent2); }
  input[type=text], select { background: var(--panel2); color: var(--text); border: 1px solid var(--line2); border-radius: 8px; padding: 8px 11px; font: inherit; min-width: 0; }
  input[type=text]:focus, select:focus { outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: -1px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .row + .row { margin-top: 10px; }
  .field { display: grid; grid-template-columns: 120px minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .field > * { min-width: 0; overflow-wrap: anywhere; }
  .sub .mono { overflow-wrap: anywhere; }
  .card:has(table) { overflow-x: auto; }
  .field:last-child { border-bottom: 0; }
  .field .k { color: var(--dim); font-size: 12.5px; }
  .switch { position: relative; width: 38px; height: 22px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch span { position: absolute; inset: 0; background: var(--line2); border-radius: 22px; transition: .15s; cursor: pointer; }
  .switch span::before { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .15s; }
  .switch input:checked + span { background: var(--accent); }
  /* Where a keyboard or a TV remote is. */
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  .switch input:checked + span::before { transform: translateX(16px); }
  .setting { display: flex; align-items: center; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .setting:last-child { border-bottom: 0; }
  .setting .t { flex: 1; } .setting .t div:first-child { font-weight: 550; } .setting .t div + div { color: var(--dim); font-size: 12.5px; }
  .empty { color: var(--dim); text-align: center; padding: 28px 10px; font-size: 13px; }
  .alert { border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); background: color-mix(in srgb, var(--accent) 9%, var(--panel)); }
  .toast { position: fixed; right: 24px; bottom: 24px; background: var(--panel2); border: 1px solid var(--line2); border-radius: 10px; padding: 11px 16px; box-shadow: 0 10px 30px rgba(0,0,0,.35); z-index: 20; display: none; max-width: 420px; }
  .toast.bad { border-color: color-mix(in srgb, var(--bad) 55%, transparent); }
  .qr { background: #fff; border-radius: 10px; padding: 10px; width: 236px; height: 236px; }
  .log { font-family: var(--mono); font-size: 12.5px; line-height: 1.6; max-height: 70vh; overflow: auto; }
  .log div { padding: 1px 0; border-bottom: 1px solid color-mix(in srgb, var(--line) 50%, transparent); white-space: pre-wrap; word-break: break-word; }
  .log .w { color: var(--warn); } .log time { color: var(--faint); margin-right: 10px; }
  .topo svg { width: 100%; height: auto; display: block; }
  .topo text { font: 11.5px Inter, system-ui, sans-serif; fill: var(--text); paint-order: stroke; stroke: var(--panel); stroke-width: 4px; stroke-linejoin: round; }
  .topo .lbl2 { fill: var(--dim); font-size: 10.5px; }
  .seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 8px; overflow: hidden; }
  .seg button { background: none; border: 0; border-radius: 0; color: var(--dim); padding: 5px 11px; font-size: 12.5px; }
  .seg button.on { background: var(--panel2); color: var(--text); }
  header.top .mlogo { display: none; width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(135deg, var(--accent), var(--violet)); place-items: center; color: #fff; font-size: 15px; font-weight: 700; flex: none; }
  #pagesel { display: none; font-size: 16px; font-weight: 600; padding: 6px 10px; min-width: 0; max-width: 60vw; }
  /* Devices: side by side only when the table has room; else pairing first. */
  @media (max-width: 1400px) { .devgrid { grid-template-columns: minmax(0, 1fr); } .devgrid > .pair { order: -1; } }
  @media (max-width: 1100px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g21, .g3 { grid-template-columns: minmax(0, 1fr); } }
  @media (max-width: 1000px) {
    /* The devices as cards (a phone, also on its side): name and connection, then the addresses, Unlink at the side. */
    .devtab thead, .devtab tr > :nth-child(5), .devtab tr > :nth-child(6) { display: none; }
    .devtab, .devtab tbody { display: block; }
    .devtab tr { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "dev conn" "v4 v4" "dns act"; gap: 6px 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
    .devtab tr:last-child { border-bottom: 0; }
    .devtab td { display: block; padding: 0; border: 0; min-width: 0; }
    .devtab td:nth-child(1) { grid-area: dev; } .devtab td:nth-child(2) { grid-area: conn; justify-self: end; }
    .devtab td:nth-child(3) { grid-area: v4; } .devtab td:nth-child(4) { grid-area: dns; word-break: break-all; }
    .devtab td:nth-child(7) { grid-area: act; align-self: end; }
    .devtab td:nth-child(3)::before { content: "IPv4  "; } .devtab td:nth-child(4)::before { content: "Hostname  "; }
    .devtab td:nth-child(3)::before, .devtab td:nth-child(4)::before { color: var(--faint); font: 600 11px Inter, system-ui, sans-serif; letter-spacing: .5px; white-space: pre; }
    .card:has(.devtab) { overflow-x: visible; }
  }
  @media (max-width: 760px) {
    .app { grid-template-columns: minmax(0, 1fr); }
    aside { position: static; height: auto; flex-direction: row; overflow-x: auto; padding: 8px; }
    .brand, .side-foot { display: none; }
    nav { display: flex; gap: 2px; } nav a span.lbl { display: none; }
    .content { padding: 16px; } header.top { padding: 10px 16px; gap: 10px; }
    .g2, .g4 { grid-template-columns: minmax(0, 1fr); }
    /* Narrow (a phone): the pages in a menu in the header instead of the side. */
    aside, header.top h1, #who { display: none; }
    header.top .mlogo { display: grid; } #pagesel { display: block; }
    .field { grid-template-columns: 76px minmax(0, 1fr) auto; }
    .field .mono { word-break: break-all; }
    .toast { left: 16px; right: 16px; bottom: 16px; max-width: none; }
  }
</style>

<script>
"use strict";
// ---- inside the Android app: it carries requests to its node and does what a page can't (the VPN, the camera) ----
const APP = window.VorkApp || null;
let callN = 0;
const calls = {};
function appAsk(req) { return new Promise((ok, no) => { const id = ++callN; calls[id] = [ok, no]; APP.ask(id, JSON.stringify(req)); }); }
window.vorkAnswer = (id, text, ok) => { const c = calls[id]; delete calls[id]; if (!c) return; if (!ok) return c[1](new Error("down")); try { c[0](JSON.parse(text)); } catch (e) { c[1](e); } };
window.vorkSaid = (t, bad) => { toast(t, bad); refresh(); };
window.vorkBack = () => { if (code) { code = null; draw(true); return true; } if (page !== "dashboard") { go("dashboard"); return true; } return false; };
window.vorkResume = () => refresh();
// ---- the key: comes with the link the node prints (#t=…), kept by this browser ----
(function () {
  const m = location.hash.match(/t=([0-9a-f]+)/);
  if (m) { localStorage.setItem("vork-token", m[1]); history.replaceState(null, "", location.pathname); }
})();
// The app and Home Assistant's ingress sign in their own way: no key.
const token = () => APP ? "app" : window.VORK_INGRESS ? "ingress" : localStorage.getItem("vork-token") || "";

// ---- state ----
let S = {}, M = null, LOG = [], page = (location.hash.match(/^#\/(\w+)/) || [])[1] || "dashboard", nokey = false, down = false;
let code = null, codeOpts = { valid: 600, many: false, approve: false }, logFilter = "", range = 3600;

// ---- helpers ----
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const short = (a) => (a || "").slice(0, 8);
const label = (nm) => (nm || "").toLowerCase().replace(/[^a-z0-9-]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 40);
const dnsName = (nm, a) => (label(nm) || short(a)) + ".vork";
const ipOf = (a) => "fd" + a.slice(0, 2) + ":" + a.slice(2, 30).match(/.{4}/g).join(":");
function derived4(a) { let v = parseInt(a.slice(0, 4), 16); if (v < 256) v += 256; return `198.18.${v >> 8}.${v & 255}`; }
function bytes(n) { if (n == null) return "–"; const u = ["B", "KB", "MB", "GB", "TB"]; let i = 0; while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; } return (i ? n.toFixed(n < 10 ? 1 : 0) : n) + " " + u[i]; }
function bits(bps) { const u = ["bit/s", "kbit/s", "Mbit/s", "Gbit/s"]; let i = 0, n = bps; while (n >= 1000 && i < u.length - 1) { n /= 1000; i++; } return (n < 10 && i && n % 1 ? n.toFixed(1) : Math.round(n)) + " " + u[i]; }
function ago(s) { if (s == null) return "–"; if (s < 2) return "just now"; if (s < 60) return s + " s"; if (s < 3600) return Math.floor(s / 60) + " min"; if (s < 86400) return Math.floor(s / 3600) + " h"; return Math.floor(s / 86400) + " d"; }
function dur(s) { const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60); return d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : `${m}m`; }
const nodes = () => S.nodes || [];
const byAddr = () => Object.fromEntries(nodes().map((n) => [n.address, n]));
const nameOf = (a) => { const n = byAddr()[a]; return (n && n.name) || short(a); };
function toast(t, bad) { const e = $("#toast"); e.textContent = t; e.className = "toast" + (bad ? " bad" : ""); e.style.display = "block"; clearTimeout(e._t); e._t = setTimeout(() => (e.style.display = "none"), 3500); }
async function copy(v) { if (APP) { APP.copy(v); return toast("Copied: " + v); } try { await navigator.clipboard.writeText(v); toast("Copied: " + v); } catch { toast(v); } }
const cp = (v) => v ? `<button class="copy" title="Copy" data-copy="${esc(v)}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></button>` : "";
const sw = (key, on, extra = "") => `<label class="switch"><input type="checkbox" data-set="${key}" ${on ? "checked" : ""} ${extra}><span></span></label>`;

let apiN = 0, LOGERR = "";
async function api(path, body) {
  if (APP) return appAsk(path === "/api/cmd" ? body : { cmd: path.slice(5) });

  // scheme's answers despite no-store, so each address is a new one.
  const wk = location.protocol === "vork:";

// ---- topology: the owner's devices and the links between them ----
// Every device tells how it reaches the others (directly or through which

function topology() {

// ---- releases on GitHub (ADR-0029): this page asks GitHub, the node isn't involved ----
const REPO = "vooteleaer/vork";
let REL = null;
async function checkReleases(force) {
  if (REL && (REL.loading || !force && Date.now() - REL.at < 3600e3)) return;
  REL = { loading: true, at: Date.now() };
  try {
    const r = await fetch(`https://api.github.com/repos/${REPO}/releases?per_page=10`, { headers: { Accept: "application/vnd.github+json" } });
    if (!r.ok) throw new Error(`GitHub answered ${r.status}`);
    REL = { list: (await r.json()).filter((x) => !x.draft), at: Date.now() };
  } catch (e) { REL = { error: e.message || String(e), at: Date.now() }; }
  if (page === "updates") draw(true);
}
// 0.2.0 > 0.2.0-dev.143 > 0.1.4: numbers first; a release is newer than the builds towards it.
function semver(v) { const m = String(v || "").replace(/^v/, "").match(/^(\d+)\.(\d+)\.(\d+)(?:-[^.]+\.?(\d+)?)?/); return m ? [+m[1], +m[2], +m[3], m[4] == null ? (/-/.test(v) ? 0 : Infinity) : +m[4]] : null; }
function newer(a, b) { const x = semver(a), y = semver(b); if (!x || !y) return false; for (let i = 0; i < 4; i++) if (x[i] !== y[i]) return x[i] > y[i]; return false; }
// The files for this machine, the installer first.
function assetsFor(target, assets) {
  const want = { "windows-x86_64": [/\.msi$/i, /^vork-windows-x86_64\.exe$/], android: [/\.apk$/i], "linux-x86_64": [/_amd64\.deb$/, /^vork-linux-x86_64$/], "linux-aarch64": [/_arm64\.deb$/, /^vork-linux-aarch64$/] }[target] || [];
  return want.flatMap((re) => assets.filter((a) => re.test(a.name)));
}
// Release notes: a little Markdown (headings, lists, **bold**, `code`, links), escaped first.
function md(text) {
  const inline = (t) => esc(t).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/\[([^\]]+)\]\((https:\/\/[^)\s]+)\)/g, (m, a, u) => `<a href="${u}" data-ext>${a}</a>`);
  let out = "", list = false, para = [];
  const flush = () => { if (para.length) out += `<p>${inline(para.join(" "))}</p>`; para = []; if (list) { out += "</ul>"; list = false; } };
  for (const line of String(text || "").replace(/\r/g, "").split("\n")) {
    const h = line.match(/^#{1,6}\s+(.*)/), li = line.match(/^\s*[-*]\s+(.*)/);
    if (h) { flush(); out += `<h3>${inline(h[1])}</h3>`; }
    else if (li) { if (para.length) { out += `<p>${inline(para.join(" "))}</p>`; para = []; } if (!list) { out += "<ul>"; list = true; } out += `<li>${inline(li[1])}</li>`; }
    else if (!line.trim()) flush();
    else { if (list) { out += "</ul>"; list = false; } para.push(line.trim()); }
  }
  flush();
  return out;
}
function openExt(url) { if (APP && APP.open) APP.open(url); else window.open(url, "_blank", "noopener"); }

function releaseCard(running, target) {
  if (!REL || REL.loading) return `<div class="card"><h2>Releases</h2><div class="sub">Asking GitHub…</div></div>`;
  const again = `<button class="btn ghost sm" id="checkReleases">Check again</button>`;
  if (REL.error) return `<div class="card"><div class="card-head"><div><h2>Releases</h2><div class="sub">GitHub couldn't be asked: ${esc(REL.error)}</div></div>${again}</div></div>`;
  const L = REL.list[0];
  if (!L) return `<div class="card"><div class="card-head"><div><h2>Releases</h2><div class="sub">No releases on GitHub yet</div></div>${again}</div></div>`;
  const up = newer(L.tag_name, running), files = assetsFor(target, L.assets || []);
  const when = L.published_at ? new Date(L.published_at).toLocaleDateString() : "";
  return `<div class="card"><div class="card-head"><div><h2>${esc(L.name || L.tag_name)} <span class="tag ${up ? "amber" : "green"}">${up ? "newer than this" : "you have it"}</span></h2>
      <div class="sub">${esc(L.tag_name)}${L.prerelease ? " · pre-release" : ""}${when ? " · " + esc(when) : ""} · from GitHub</div></div>${again}</div>
    ${up ? `<div class="row" style="margin:4px 0 12px">${files.map((a, i) => `<a class="btn ${i ? "ghost" : ""}" href="${esc(a.browser_download_url)}" data-ext>Download ${esc(a.name)}</a>`).join("")}
      <a class="btn ghost" href="${esc(L.html_url)}" data-ext>Release page</a></div>` : ""}

}

  if (!box) return null;
  const sig = (e) => e.id || e.tagName + JSON.stringify(e.dataset) + (e.textContent || "").trim().slice(0, 40);
  return { box: "#" + box.id, sig: sig(a), at: focusables(box).indexOf(a), sigOf: sig };
}
function refocus(k) {
  if (document.activeElement && document.activeElement !== document.body) return;
  const all = focusables($(k.box));
  const e = all.find((x) => k.sigOf(x) === k.sig) || all[Math.min(k.at, all.length - 1)];
  if (e) e.focus({ preventScroll: true });
}
// The arrows move to the nearest control that way (the Android app, where a
// TV remote has no Tab); Enter presses links and switches as a tap would.
document.addEventListener("keydown", (e) => {
  const t = document.activeElement, typing = t && (t.tagName === "INPUT" && t.type !== "checkbox" || t.tagName === "TEXTAREA" || t.tagName === "SELECT");
  if (e.key === "Enter" && t && !typing && (t.matches("a[data-page], [tabindex]") || t.type === "checkbox")) { e.preventDefault(); t.click(); return; }
  const d = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] }[e.key];
  if (!APP || !d || typing && d[0]) return;
  const from = t && t !== document.body ? t.getBoundingClientRect() : { left: 0, top: 0, right: 0, bottom: 0 };
  const fx = (from.left + from.right) / 2, fy = (from.top + from.bottom) / 2;
  let best = null, bestScore = Infinity;
  for (const c of focusables()) {
    if (c === t) continue;
    const r = c.getBoundingClientRect(), x = (r.left + r.right) / 2, y = (r.top + r.bottom) / 2;
    const along = (x - fx) * d[0] + (y - fy) * d[1], across = Math.abs((x - fx) * d[1] + (y - fy) * d[0]);
    if (along <= 4) continue;
    const score = along + across * 2;
    if (score < bestScore) { bestScore = score; best = c; }
  }
  e.preventDefault();
  if (best) { best.focus({ preventScroll: true }); best.scrollIntoView({ block: "nearest", inline: "nearest" }); }
  else if (d[1]) window.scrollBy(0, d[1] * 240);
});

// ---- drawing ----
const RENDER = { dashboard: pDashboard, devices: pDevices, network: pNetwork, firewall: pFirewall, exit: pExit, updates: pUpdates, settings: pSettings, log: pLog };
function draw(force) {
  const was = focusKey();
  const st = $("#state");
  if (nokey) { st.innerHTML = '<span class="dot warn"></span>Key needed'; } else if (down) { st.innerHTML = '<span class="dot bad"></span>Not answering'; }
  else { st.innerHTML = `<span class="dot ok"></span>Online · ${dur(S.uptime_s || 0)}`; }
  $("#who").textContent = S.name ? `${S.name} · ${short(S.address)}` : "";
  $("#title").textContent = (PAGES.find(([id]) => id === page) || [, ""])[1];
  drawNav();
  // Typing isn't interrupted by the refresh.
  const a = document.activeElement;
  if (!force && a && $("#page").contains(a) && (a.tagName === "INPUT" && a.type === "text" || a.tagName === "SELECT")) return was && refocus(was);
  $("#page").innerHTML = nokey ? keyPage() : requests() + (RENDER[page] || pDashboard)();
  if (was) refocus(was);
  if (!nokey && page === "dashboard") chartsDashboard();
  if (page === "firewall") rulePreview();
  const q = $("#qr");
  if (q && code) {
    const rows = code.qr, n = rows.length, quiet = 3, cell = Math.floor(q.width / (n + 2 * quiet)), off = Math.floor((q.width - cell * (n + 2 * quiet)) / 2), g = q.getContext("2d");
    g.fillStyle = "#fff"; g.fillRect(0, 0, q.width, q.height); g.fillStyle = "#000";
    rows.forEach((row, y) => [...row].forEach((b, x) => { if (b === "1") g.fillRect(off + (x + quiet) * cell, off + (y + quiet) * cell, cell, cell); }));
  }
}

async function refresh() {
  if (!token()) { nokey = true; draw(); return; }
  try {
    const [s, m] = await Promise.all([api("/api/status"), api("/api/metrics")]);
    S = s; M = m; nokey = false; down = false;
    if (page === "log") { const l = await api("/api/log"); LOG = l.lines || []; LOGERR = l.error || ""; }
  } catch (e) { if (!nokey) down = true; }
  draw();
}

// ---- actions ----
function go(p) { page = p; history.replaceState(null, "", "#/" + page); code = null; window.scrollTo(0, 0); if (page === "log") refresh(); draw(true); }
document.addEventListener("click", async (e) => {
  const ext = e.target.closest("a[data-ext]");
  if (ext) { e.preventDefault(); return openExt(ext.href); }
  const t = e.target.closest("[data-page], button, input[type=checkbox]");
  if (!t) return;
  const d = t.dataset;
  if (d.page) return go(d.page);
  if (t.id === "vpn") return APP.vpn(t.checked);
  if (t.id === "scan") return APP.scan();
  if (t.id === "restartNode") { APP.restart(); return toast("Restarting the node"); }
  if (t.id === "stopNode") { if (confirm("Stop the node? This phone leaves vØrk until the app is opened again.")) { APP.stop(); toast("Stopped"); } return; }
  if (d.copy) return copy(d.copy);
  if (d.valid) { codeOpts.valid = +d.valid; return draw(true); }
  if (t.id === "many") { codeOpts.many = t.checked; return; }
  if (t.id === "approve") { codeOpts.approve = t.checked; return; }
  if (t.id === "makeCode") { const r = await cmd({ cmd: "link_code", valid_s: codeOpts.valid, uses: codeOpts.many ? 0 : 1, approve: codeOpts.approve }); if (r.error) toast(r.error, true); else { code = r; draw(true); } return; }
  if (t.id === "codeDone") { code = null; return draw(true); }
  if (t.id === "link") {
    const v = $("#paste").value.trim(), m = v.match(/^(?:vork-link:|vork:link\/)?([0-9a-fA-F]{32})(?:\?(.*))?$/);
    if (!m) return toast("That isn't a vØrk link or address", true);
    const q = new URLSearchParams(m[2] || ""), c = q.get("c") || "";
    $("#paste").value = "";
    return act({ cmd: "link", address: m[1].toLowerCase(), code: c, addrs: (q.get("a") || "").split(",").filter(Boolean) }, c ? "Linking…" : "Asked: linked once its owner allows it");
  }
  if (d.unlink) { if (confirm("Unlink " + nameOf(d.unlink) + "? It's told, and stops reaching this node's services.")) act({ cmd: "unlink", address: d.unlink }, "Unlinked"); return; }
  if (d.allow) return act({ cmd: "link_allow", address: d.allow }, "Allowed: one of your devices now");
  if (d.dismiss) return act({ cmd: "link_dismiss", address: d.dismiss }, "Dismissed");
  if (t.id === "saveName") return act({ cmd: "set", key: "name", value: $("#name").value.trim() }, "Saved");
  if (t.id === "addPeer") { let v = $("#peer").value.trim(); if (!v) return; if (!/:\d+$/.test(v)) v += ":51820"; return act({ cmd: "peer_add", addr: v }, "Connecting to " + v); }
  if (d.peerRemove) return act({ cmd: "peer_remove", addr: d.peerRemove }, "Removed");
  if (t.id === "addRule") { const r = rulePreview(); if (!r) return; return act({ cmd: "allow_add", rule: r }, "Opened: " + r); }
  if (d.ruleRemove) return act({ cmd: "allow_remove", rule: d.ruleRemove }, "Closed: " + d.ruleRemove);
  if (d.ruleAdd) return act({ cmd: "allow_add", rule: d.ruleAdd }, "Opened: " + d.ruleAdd);
  if (d.exitVia !== undefined) return act({ cmd: "set", key: "exit_via", value: d.exitVia }, d.exitVia ? "Internet through " + nameOf(d.exitVia) : "Internet directly");
  if (t.id === "checkReleases") return checkReleases(true);
  if (t.id === "portAuto") { $("#port").value = 40000 + Math.floor(Math.random() * 20000); return; }
  if (t.id === "savePort") { const p = Number($("#port").value.trim()); if (!(p >= 1 && p <= 65535)) return toast("A port is a number from 1 to 65535", true); return act({ cmd: "set", key: "port", value: p }, `UDP port ${p} saved`); }
  if (t.id === "restartNow") { if (APP) { APP.restart(); toast("Restarting"); return; } try { await cmd({ cmd: "restart" }); toast("Restarting: back in a few seconds"); } catch (e) { toast("The node didn't answer", true); } return; }
  if (t.id === "checkUpdate") return act({ cmd: "update_check" }, "Looking for a newer release");
  if (t.id === "useKey") {
    const m = $("#key").value.trim().match(/(?:#t=)?([0-9a-f]{16,})\s*$/i);
    if (!m) return toast("That isn't the dashboard's key or its link", true);
    localStorage.setItem("vork-token", m[1].toLowerCase()); nokey = false; toast("Key saved"); return refresh();
  }
  if (d.set) {
    if (d.set === "exit_auto") return act({ cmd: "set", key: "exit_via", value: t.checked ? "auto" : "" }, t.checked ? "The exit is chosen automatically" : "Internet directly");
    return act({ cmd: "set", key: d.set, value: t.checked }, "Saved");
  }
});
document.addEventListener("input", (e) => {
  if (e.target.id === "logFilter") { logFilter = e.target.value; const box = $("#logbox"); if (box) { const lines = LOG.filter((l) => !logFilter || l.msg.toLowerCase().includes(logFilter.toLowerCase())); box.innerHTML = lines.slice().reverse().map((l) => `<div class="${l.warn ? "w" : ""}"><time>${new Date(l.t * 1000).toLocaleTimeString()}</time>${esc(l.msg)}</div>`).join(""); } }
  if (["r-proto", "r-port", "r-from", "r-custom"].includes(e.target.id)) rulePreview();
});
document.addEventListener("change", (e) => { if (e.target.id === "pagesel") return go(e.target.value); if (["r-proto", "r-from"].includes(e.target.id)) rulePreview(); });
window.addEventListener("resize", () => page === "dashboard" && chartsDashboard());

refresh();
setInterval(refresh, 5000);
</script>
