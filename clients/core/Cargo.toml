[package]
name = "vork-desktop-core"
description = "What every vork-desktop front end shares: talking to vorkd through libvork"
version.workspace = true
edition = "2021"
license.workspace = true
publish.workspace = true

[dependencies]
libvork = { path = "../../crates/libvork" }
# Libraries as files (Android's DocumentsProvider): the FUSE mount's tree.
vork-tree = { path = "../../crates/vork-tree" }
# Fingerprint words, to tell members apart (ADR-0020).
vork-core = { path = "../../crates/vork-core" }
tokio = { version = "1", features = ["rt"] }
# prnsd status --json
serde_json = "1"
# The disk the store is on: the defaults the settings show
fs4 = "0.13"
