[package]
name = "vork-desktop-jni"
description = "vork-desktop for Android: the shared core to Kotlin, through JNI, as JSON"
version = "0.6.0"
edition = "2021"
license = "MIT"
publish = false

# Outside the vork workspace (excluded there): it takes the Contacts and
# Calendar cores from their own repositories (vork-contacts, vork-calendar),
# next to the vork repository.
[workspace]

[lib]
name = "vork_desktop"
crate-type = ["cdylib"]

[dependencies]
vork-desktop-core = { path = "../../core" }
vork-api = { path = "../../../crates/vork-api" }
jni = { version = "0.21", default-features = false }
# The DocumentsProvider's listings
serde_json = "1"
# The contacts sync adapter (Android's own Contacts): vork-contacts' records.
vork-contacts-core = { path = "../../../../vork-contacts/core" }
# The calendar sync adapter (Android's own Calendar): vork-calendar's events.
vork-calendar-core = { path = "../../../../vork-calendar/core" }
