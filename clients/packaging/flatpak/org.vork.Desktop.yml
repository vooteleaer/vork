# org.vork.Desktop: the utility only. vØrk itself (the node, vorkd, the
# CLI, the FUSE mount) is the host's, from the vork .deb; the utility reaches
# its user services through `flatpak-spawn --host`. Build it with
# build.sh next to this: it stages the sources this names (src/…) beside a
# copy of this file.
id: org.vork.Desktop
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: vork-desktop
finish-args:
  # vorkd's socket is in the shared store; the vØrk node's (api.sock,
  # control.sock) in /var/lib/vork (the system node) or ~/.local/state/vork
  # (a user's own), and its settings in /etc/vork or ~/.config/vork.
  - --share=network
  - --filesystem=/var/lib/vork
  - --filesystem=xdg-state/vork:create
  - --filesystem=host-etc:ro
  - --filesystem=xdg-config/vork:create
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # The one store every vork Flatpak and the host's vorkd share.
  - --filesystem=xdg-data/vork:create
  # systemctl --user on the host (flatpak-spawn --host).
  - --talk-name=org.freedesktop.Flatpak
  # The tray icon (StatusNotifierItem).
  - --talk-name=org.kde.StatusNotifierWatcher
  - --own-name=org.kde.StatusNotifierItem-2-1
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  # cargo fetches the crates (local bundles; no vendoring).
  build-args:
    - --share=network
  env:
    CARGO_HOME: /run/build/vork-desktop/cargo
modules:
  - name: vork-desktop
    buildsystem: simple
    sources:
      - type: dir
        path: src/vork
        dest: vork
      # The store set (inside a Flatpak XDG_DATA_HOME is the app's own),
      # then the program.
      - type: script
        dest-filename: wrapper
        commands:
          - ': "${VORK_STORE:=$HOME/.local/share/vork}"'
          - export VORK_STORE
          # The node's paths on the host (inside, XDG_* are the app's own and
          # the host's /etc is /run/host/etc): the system node's, else the user's.
          - if [ -S /var/lib/vork/control.sock ]; then
          -   ': "${VORK_API:=/var/lib/vork/api.sock}" "${VORK_CONTROL:=/var/lib/vork/control.sock}" "${VORK_CONFIG:=/run/host/etc/vork/vork.toml}"'
          - else
          -   ': "${VORK_API:=$HOME/.local/state/vork/api.sock}" "${VORK_CONTROL:=$HOME/.local/state/vork/control.sock}" "${VORK_CONFIG:=$HOME/.config/vork/vork.toml}"'
          - fi
          - export VORK_API VORK_CONTROL VORK_CONFIG
          - exec /app/libexec/vork-desktop "$@"
    build-commands:
      - cargo build --release --locked --manifest-path vork/Cargo.toml -p vork-desktop-gtk
      - install -Dm755 vork/target/release/vork-desktop /app/libexec/vork-desktop
      - install -Dm755 wrapper /app/bin/vork-desktop
      - install -Dm644 vork/clients/packaging/org.vork.Desktop.desktop -t /app/share/applications
      - install -Dm644 vork/clients/packaging/org.vork.Desktop.svg -t /app/share/icons/hicolor/scalable/apps
      - install -Dm644 vork/clients/packaging/flatpak/org.vork.Desktop.metainfo.xml -t /app/share/metainfo
      - install -Dm644 vork/LICENSE -t /app/share/licenses/org.vork.Desktop
