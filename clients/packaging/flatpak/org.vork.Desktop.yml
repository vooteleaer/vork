# org.vork.Desktop: the utility only. vork itself (vorkd, the CLI,
# the FUSE mount) is the host's, from the vork .deb; the utility reaches
# its user services and prnsd through `flatpak-spawn --host`. Build it with
# build.sh next to this: it stages the sources this names (src/…) beside a
# copy of this file.
id: org.vork.Desktop
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: vork-desktop
finish-args:
  # vorkd's socket is in the shared store; Reticulum's shared instance
  # (TCP 127.0.0.1:37428 or the abstract socket @rns/default) needs the
  # host's network.
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # The one store every vork Flatpak and the host's vorkd share.
  - --filesystem=xdg-data/vork:create
  # systemctl --user and prnsd on the host (flatpak-spawn --host).
  - --talk-name=org.freedesktop.Flatpak
  # The tray icon (StatusNotifierItem).
  - --talk-name=org.kde.StatusNotifierWatcher
  - --own-name=org.kde.StatusNotifierItem-2-1
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  # cargo fetches the crates (local bundles; no vendoring).
  build-args:
    - --share=network
  env:
    CARGO_HOME: /run/build/vork-desktop/cargo
modules:
  - name: vork-desktop
    buildsystem: simple
    sources:
      - type: dir
        path: src/vork
        dest: vork
      # The workspace's Android crate names Calendar's and Contacts' cores.
      - type: dir
        path: src/vork-calendar
        dest: vork-calendar
      - type: dir
        path: src/vork-contacts
        dest: vork-contacts
      - type: dir
        path: src/vork-desktop
        dest: vork-desktop
      # The store set (inside a Flatpak XDG_DATA_HOME is the app's own),
      # then the program.
      - type: script
        dest-filename: wrapper
        commands:
          - ': "${VORK_STORE:=$HOME/.local/share/vork}"'
          - export VORK_STORE
          - exec /app/libexec/vork-desktop "$@"
    build-commands:
      - cargo build --release --locked --manifest-path vork-desktop/Cargo.toml -p vork-desktop-gtk
      - install -Dm755 vork-desktop/target/release/vork-desktop /app/libexec/vork-desktop
      - install -Dm755 wrapper /app/bin/vork-desktop
      - install -Dm644 vork-desktop/packaging/org.vork.Desktop.desktop -t /app/share/applications
      - install -Dm644 vork-desktop/packaging/org.vork.Desktop.svg -t /app/share/icons/hicolor/scalable/apps
      - install -Dm644 vork-desktop/packaging/flatpak/org.vork.Desktop.metainfo.xml -t /app/share/metainfo
      - install -Dm644 vork-desktop/LICENSE -t /app/share/licenses/org.vork.Desktop
