[package]
name = "vork-haikufs"
version = "0.6.0"
description = "A namespace as a Haiku volume: a userlandfs module with Haiku's file system interface (ADR-0002), prototype"
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
libvork = { path = "../libvork" }
vork-tree = { path = "../vork-tree" }
tokio = { version = "1", features = ["rt", "time"] }

[target.'cfg(target_os = "haiku")'.dependencies]
libc = "0.2"
