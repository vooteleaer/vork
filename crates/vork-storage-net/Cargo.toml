[package]
name = "vork-storage-net"
version = "0.6.0"
description = "vØrk storage networking over the machine's vØrk node (prototype, unstable)"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
getrandom = "0.3"
hex = "0.4"
sha2 = "0.10"
vork-api = { path = "../vork-api" }
vork-core = { path = "../vork-core" }
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
