[package]
name = "vork-extract"
version = "0.6.0"
description = "vork-extractd: reads new content and writes what's in it as attributes (ADR-0023)"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "vork-extractd"
path = "src/bin/vork-extractd.rs"

[dependencies]
libvork = { path = "../libvork" }
tokio = { version = "1", features = ["rt"] }
sha2 = "0.10"
infer = "0.19"
imagesize = "0.13"
kamadak-exif = "0.6"
lofty = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "tiff", "bmp"] }
