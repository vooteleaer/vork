<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .t { fill: #1f2328; }
    .m { fill: #656d76; }
    .other { fill: #eef1f4; stroke: #9aa4ae; stroke-width: 1.5; }
    .mine { fill: #e7efff; stroke: #4f7cff; stroke-width: 2.5; }
    .mesh { stroke: #c4cbd3; stroke-width: 1.5; }
    .path { stroke: #4f7cff; stroke-width: 3.5; fill: none; stroke-linecap: round; }
    .garden { fill: none; stroke: #4f7cff; stroke-width: 1.5; stroke-dasharray: 6 6; opacity: .55; }
    .lock { fill: #4f7cff; }
    .pill { fill: #4f7cff; }
    .pt { fill: #ffffff; font-weight: 600; }
    .ico { fill: none; stroke: #4f7cff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .ico2 { fill: none; stroke: #8b949e; stroke-width: 1.6; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .t { fill: #e6edf3; }
      .m { fill: #8b949e; }
      .other { fill: #161b22; stroke: #484f58; }
      .mine { fill: #15213d; stroke: #6d93ff; }
      .mesh { stroke: #30363d; }
      .path { stroke: #6d93ff; }
      .garden { stroke: #6d93ff; }
      .lock, .pill { fill: #6d93ff; }
      .pt { fill: #0d1117; }
      .ico { stroke: #8fb0ff; }
      .ico2 { stroke: #6e7681; }
    }
  </style>
  <rect class="bg" width="900" height="500" rx="16"/>

  <!-- the public mesh: other people's nodes -->
  <g class="mesh">
    <line x1="330" y1="150" x2="450" y2="110"/><line x1="450" y1="110" x2="570" y2="150"/>
    <line x1="330" y1="150" x2="390" y2="250"/><line x1="450" y1="110" x2="390" y2="250"/>
    <line x1="450" y1="110" x2="510" y2="250"/><line x1="570" y1="150" x2="510" y2="250"/>
    <line x1="390" y1="250" x2="510" y2="250"/><line x1="390" y1="250" x2="450" y2="340"/>
    <line x1="510" y1="250" x2="450" y2="340"/><line x1="330" y1="150" x2="290" y2="290"/>
    <line x1="290" y1="290" x2="390" y2="250"/><line x1="290" y1="290" x2="450" y2="340"/>
    <line x1="570" y1="150" x2="620" y2="300"/><line x1="620" y1="300" x2="510" y2="250"/>
    <line x1="620" y1="300" x2="450" y2="340"/>
    <!-- your devices' links into the mesh -->
    <line x1="140" y1="130" x2="330" y2="150"/><line x1="140" y1="340" x2="290" y2="290"/>
    <line x1="760" y1="130" x2="570" y2="150"/><line x1="760" y1="340" x2="620" y2="300"/>
  </g>
  <g>
    <circle class="other" cx="330" cy="150" r="13"/><circle class="other" cx="450" cy="110" r="13"/>
    <circle class="other" cx="570" cy="150" r="13"/><circle class="other" cx="390" cy="250" r="13"/>
    <circle class="other" cx="510" cy="250" r="13"/><circle class="other" cx="450" cy="340" r="13"/>
    <circle class="other" cx="290" cy="290" r="13"/><circle class="other" cx="620" cy="300" r="13"/>
  </g>
  <text class="m" x="450" y="470" text-anchor="middle" font-size="14">Other people's vØrk nodes: they relay for everyone, but can't read or reach your devices</text>

  <!-- your traffic: phone -> two relays -> home server -->
  <path class="path" d="M140 340 L290 290 L390 250 L510 250 L570 150 L760 130"/>
  <g transform="translate(450 214)"><rect class="pill" x="-72" y="-14" width="144" height="26" rx="13"/>
    <text class="pt" x="0" y="4" text-anchor="middle" font-size="12.5">sealed end to end</text></g>

  <!-- garden outline around your devices -->
  <path class="garden" d="M60 70 C 20 70, 20 425, 60 430 L 230 430 C 250 430, 250 70, 230 70 Z"/>
  <path class="garden" d="M840 70 C 880 70, 880 425, 840 430 L 670 430 C 650 430, 650 70, 670 70 Z"/>
  <text class="t" x="140" y="58" text-anchor="middle" font-size="15" font-weight="600">Your devices</text>
  <text class="t" x="760" y="58" text-anchor="middle" font-size="15" font-weight="600">Your devices</text>

  <!-- laptop -->
  <circle class="mine" cx="140" cy="130" r="30"/>
  <g class="ico" transform="translate(140 130)"><rect x="-12" y="-9" width="24" height="15" rx="2"/><path d="M-16 10 h32"/></g>
  <text class="t" x="140" y="182" text-anchor="middle" font-size="14" font-weight="600">laptop.vork</text>
  <text class="m" x="140" y="200" text-anchor="middle" font-size="12.5">café Wi-Fi</text>
  <!-- phone -->
  <circle class="mine" cx="140" cy="340" r="30"/>
  <g class="ico" transform="translate(140 340)"><rect x="-8" y="-13" width="16" height="26" rx="3"/><path d="M-2 9 h4"/></g>
  <text class="t" x="140" y="392" text-anchor="middle" font-size="14" font-weight="600">phone.vork</text>
  <text class="m" x="140" y="410" text-anchor="middle" font-size="12.5">on mobile data</text>
  <!-- home server -->
  <circle class="mine" cx="760" cy="130" r="30"/>
  <g class="ico" transform="translate(760 130)"><rect x="-12" y="-13" width="24" height="10" rx="2"/><rect x="-12" y="1" width="24" height="10" rx="2"/><path d="M-7 -8 h2 M-7 6 h2"/></g>
  <text class="t" x="760" y="182" text-anchor="middle" font-size="14" font-weight="600">home-server.vork</text>
  <text class="m" x="760" y="200" text-anchor="middle" font-size="12.5">behind your home router</text>
  <!-- desktop -->
  <circle class="mine" cx="760" cy="340" r="30"/>
  <g class="ico" transform="translate(760 340)"><rect x="-13" y="-11" width="26" height="17" rx="2"/><path d="M-5 11 h10 M0 6 v5"/></g>
  <text class="t" x="760" y="392" text-anchor="middle" font-size="14" font-weight="600">desktop.vork</text>
  <text class="m" x="760" y="410" text-anchor="middle" font-size="12.5">at the office</text>
</svg>
